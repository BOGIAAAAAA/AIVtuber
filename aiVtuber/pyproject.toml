# 只放工具設定（pytest、ruff）；相依套件請見 requirements*.txt。

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
# 每個測試最多 30 秒（需要 pytest-timeout，見 requirements-dev.txt）：實作出錯時測試會失敗，而不是整個卡住
timeout = 30

[tool.ruff]
target-version = "py39"
line-length = 120
# GPT-SoVITS 是 tts_server/setup_gpt_sovits.* 從上游 clone 下來的外部程式碼（已被 .gitignore 忽略）；
# vtvenv 是舊版留下的訓練輸出。兩者都不做檢查
extend-exclude = ["GPT-SoVITS", "vtvenv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # 中文註解與字串中的全形標點是刻意的
]

[tool.ruff.lint.pyupgrade]
# config.py 在執行期用 typing.get_type_hints() 解析欄位型別，Python 3.9 不能用 X | None
keep-runtime-typing = true

[tool.ruff.lint.isort]
known-first-party = ["vtuber"]
